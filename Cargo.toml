[package]
name = "wgpucheck"
version = "0.1.0"
edition = "2024"
description = """
  wgpucheck is a CLI tool, that will show you information about your system's GPU, and its compute capabilities.
"""
publish = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dialoguer = "0.12.0"
env_logger = "0.11.10"
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wgpu = { version = "29.0.3", features = ["serde"] }
